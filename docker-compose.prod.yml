services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: yard
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - yard-db-data:/var/lib/postgresql/data

  app:
    image: ghcr.io/rgrzazek/yard:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/yard
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  # Read-only log viewer, reachable only through Caddy behind a login —
  # gives log access without handing out SSH keys to the box itself.
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - dozzle

volumes:
  yard-db-data:
  caddy-data:
  caddy-config:
