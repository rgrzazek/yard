spring.application.name=yard
spring.profiles.active=local
gemini.api.key=

spring.datasource.url=jdbc:postgresql://localhost:5432/yard
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No self-service registration: accounts are seeded from these properties.
# Real values belong in application-local.properties (gitignored), never here.
app.seed.user1.username=
app.seed.user1.password=
app.seed.user2.username=
app.seed.user2.password=

# Error responses: never leak internals to clients (these are the Spring Boot
# defaults, set explicitly so the intent is documented and can't drift).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
