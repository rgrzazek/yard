spring.application.name=yard
spring.profiles.active=local
gemini.api.key=

spring.datasource.url=jdbc:postgresql://localhost:5432/yard
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Both local and prod databases already had tables (from ddl-auto=update,
# pre-dating Flyway) before V1 ever ran — baseline lets Flyway adopt that
# existing schema instead of refusing to touch a database it doesn't recognize.
# baseline-version is 0, one below our first real migration (V1), so V1 still
# runs instead of being treated as already-applied at the baseline point.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# No self-service registration: accounts are seeded from these properties.
# Real values belong in application-local.properties (gitignored), never here.
app.seed.user1.username=
app.seed.user1.password=
app.seed.user2.username=
app.seed.user2.password=

# Error responses: never leak internals to clients (these are the Spring Boot
# defaults, set explicitly so the intent is documented and can't drift).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
