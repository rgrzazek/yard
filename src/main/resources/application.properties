spring.application.name=yard
spring.profiles.active=local
gemini.api.key=

spring.datasource.url=jdbc:postgresql://localhost:5432/yard
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Error responses: never leak internals to clients (these are the Spring Boot
# defaults, set explicitly so the intent is documented and can't drift).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
