<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <title>Recipes</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/dinner.css}">
  <style>
    .tonights-pick {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--chrome);
      color: var(--bg);
      padding: 1rem 1.5rem;
      text-decoration: none;
      margin-bottom: 2rem;
    }

    .tonights-pick:hover {
      background: #2e4d3f;
    }

    .tonights-pick-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .tonights-pick-title {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .tonights-pick-arrow {
      margin-left: auto;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .dinner-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .source-filter {
      display: flex;
      border: 2px solid var(--chrome);
      width: fit-content;
    }

    .source-btn {
      padding: 0.35rem 1rem;
      border: none;
      border-right: 1px solid var(--chrome);
      background: white;
      color: var(--chrome);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .source-btn:last-child {
      border-right: none;
    }

    .source-btn.active {
      background: var(--chrome);
      color: var(--bg);
    }

    .generate-btn {
      padding: 0.35rem 1rem;
      border: 2px solid var(--accent);
      background: white;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .generate-btn:hover {
      background: var(--accent);
      color: white;
    }

    .chip-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .chip {
      padding: 0.35rem 0.85rem;
      border: 2px solid var(--chrome);
      background: white;
      color: var(--chrome);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }

    .chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
  </style>
</head>

<body>
  <div th:insert="~{fragments/header :: header}"></div>
  <header th:insert="~{fragments/nav :: nav}"></header>

  <main>
    <a class="tonights-pick" th:href="@{/dinner/{token}(token=${tonightsRecipe.token})}">
      <span class="tonights-pick-label">Tonight's Pick</span>
      <span class="tonights-pick-title" th:text="${tonightsRecipe.title}"></span>
      <span class="tonights-pick-arrow">→</span>
    </a>

    <div class="dinner-toolbar">
      <div class="source-filter">
        <button class="source-btn active" th:if="${hasCustomRecipes}" data-source="all">All</button>
        <button class="source-btn" th:classappend="${!hasCustomRecipes} ? ' active'"
          data-source="Original">Original</button>
        <button class="source-btn" th:if="${hasCustomRecipes}" data-source="Custom">Custom</button>
      </div>
      <div class="toolbar-actions">
        <button class="generate-btn" id="pick-random">Pick random →</button>
        <a class="generate-btn" sec:authorize="isAuthenticated()" th:href="@{/dinner/new}">+ Add a recipe</a>
      </div>
    </div>

    <div class="chip-filter">
      <button class="chip" th:each="name : ${ingredientNames}" th:text="${name}" th:attr="data-name=${name}">
      </button>
    </div>

    <section class="project-grid">
      <a class="project-card" th:each="recipe : ${recipes}" th:href="@{/dinner/{token}(token=${recipe.token})}"
        th:attr="data-ingredients=${recipe.ingredientNames},data-source=${recipe.global ? 'Original' : 'Custom'}">
        <span class="source-badge" th:classappend="${recipe.global} ? ' original' : ' custom'"
          th:text="${recipe.global} ? 'Original' : 'Custom'"></span>
        <h2 th:text="${recipe.title}"></h2>
      </a>
    </section>
  </main>

  <script type="module">
    import { Randomiser } from '/js/randomiser.js';

    document.getElementById('pick-random').addEventListener('click', () => {
      const items = [...document.querySelectorAll('.project-card')]
        .filter(card => card.style.display !== 'none')
        .map(card => ({ label: card.querySelector('h2').textContent, value: card.href }));

      new Randomiser(items)
        .on('result', winner => { window.location.href = winner.value; })
        .start();
    });
  </script>

  <script>
    // ── Source filter ──
    const cards = document.querySelectorAll('.project-card');
    const chips = document.querySelectorAll('.chip[data-name]');
    const selected = new Set();
    let activeSource = 'all';

    document.querySelectorAll('.source-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeSource = btn.dataset.source;
        filter();
      });
    });

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('selected');
        const name = chip.dataset.name;
        selected.has(name) ? selected.delete(name) : selected.add(name);
        filter();
      });
    });

    function filter() {
      cards.forEach(card => {
        const sourceMatch = activeSource === 'all' || card.dataset.source === activeSource;
        if (!sourceMatch) { card.style.display = 'none'; return; }
        if (selected.size === 0) { card.style.display = ''; return; }
        const ingredients = new Set(card.dataset.ingredients.split(','));
        card.style.display = [...selected].every(s => ingredients.has(s)) ? '' : 'none';
      });
    }
  </script>

</body>

</html>
