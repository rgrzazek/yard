<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Set up your household</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    .group-setup {
      max-width: 480px;
      margin: 3rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .group-setup button {
      padding: 0.6rem 1.5rem;
      background: var(--chrome);
      color: var(--bg);
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      align-self: flex-start;
    }

    .group-setup button:hover {
      background: #2e4d3f;
    }
  </style>
</head>

<body>
  <div th:insert="~{fragments/header :: header}"></div>
  <header th:insert="~{fragments/nav :: nav}"></header>

  <main>
    <div class="group-setup">
      <h1>You're not in a household yet</h1>
      <p>Start a new one, or ask someone already in a household to send you their invite link.</p>
      <form th:action="@{/group/start}" method="post">
        <button type="submit">Start a new household →</button>
      </form>
    </div>
  </main>
</body>

</html>
