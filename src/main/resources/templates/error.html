<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title th:text="'Error ' + ${status}">Error</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    .error-page { text-align: center; padding: 4rem 1rem; }
    .error-page .status { font-size: 4rem; font-weight: 700; color: var(--chrome); margin: 0 auto; }
    .error-page .reason { font-size: 1.25rem; color: var(--chrome); margin: .25rem auto 1.5rem; }
    .error-page p { margin: 0 auto 1.5rem; max-width: 32rem; }
    .error-page a { color: var(--chrome); font-weight: 600; }
  </style>
</head>

<body>
  <div th:insert="~{fragments/header :: header}"></div>
  <header th:insert="~{fragments/nav :: nav}"></header>

  <main>
    <div class="error-page">
      <p class="status" th:text="${status}">404</p>
      <p class="reason" th:text="${error}">Not Found</p>
      <p th:if="${status == 404}">That page isn't here. It may have moved, or it never existed.</p>
      <p th:unless="${status == 404}">Something went wrong on this end — nothing you did.</p>
      <p><a th:href="@{/}">Back to home</a></p>
    </div>
  </main>

</body>

</html>
