<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Add a recipe</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    .recipe-form {
      max-width: 560px;
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .recipe-form input[type=text] {
      padding: 0.5rem;
      border: 2px solid var(--chrome);
      font-family: inherit;
      font-size: 1rem;
      width: 100%;
    }

    .form-errors {
      color: var(--accent);
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin: 0;
    }

    .form-errors li {
      margin: 0.25rem 0;
    }

    .field-group h2 {
      font-size: 1rem;
      color: var(--chrome);
      margin-bottom: 0.5rem;
    }

    .dyn-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .dyn-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
    }

    .dyn-row.dragging {
      opacity: 0.4;
    }

    .drag-handle {
      cursor: grab;
      color: var(--chrome);
      opacity: 0.5;
      user-select: none;
      flex-shrink: 0;
    }

    .remove-row {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .add-row-btn {
      padding: 0.4rem 1rem;
      background: none;
      border: 2px solid var(--chrome);
      color: var(--chrome);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      align-self: flex-start;
    }

    .add-row-btn:hover {
      background: var(--chrome);
      color: var(--bg);
    }

    .save-btn {
      padding: 0.6rem 1.5rem;
      background: var(--chrome);
      color: var(--bg);
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      align-self: flex-start;
    }

    .save-btn:hover {
      background: #2e4d3f;
    }
  </style>
</head>

<body>
  <div th:insert="~{fragments/header :: header}"></div>
  <header th:insert="~{fragments/nav :: nav}"></header>

  <main>
    <form class="recipe-form" th:action="@{/dinner/save}" th:object="${recipeForm}" method="post">

      <ul class="form-errors" th:if="${limitError}">
        <li th:text="${limitError}"></li>
      </ul>
      <ul class="form-errors" th:if="${#fields.hasAnyErrors()}">
        <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
      </ul>

      <div class="field-group">
        <h2>Title</h2>
        <input type="text" th:field="*{title}" maxlength="150" required>
      </div>

      <div class="field-group">
        <h2>Ingredients</h2>
        <div class="dyn-list" id="ingredient-list">
          <div class="dyn-row" draggable="true" th:each="line : ${recipeForm.ingredients}">
            <span class="drag-handle">⠿</span>
            <input type="text" name="ingredients" maxlength="100" th:value="${line}" required>
            <button type="button" class="remove-row">✕</button>
          </div>
        </div>
        <button type="button" class="add-row-btn" data-add-to="ingredient-list" data-name="ingredients"
                data-maxlength="100">+ Add ingredient</button>
      </div>

      <div class="field-group">
        <h2>Steps</h2>
        <div class="dyn-list" id="step-list">
          <div class="dyn-row" draggable="true" th:each="line : ${recipeForm.steps}">
            <span class="drag-handle">⠿</span>
            <input type="text" name="steps" maxlength="500" th:value="${line}" required>
            <button type="button" class="remove-row">✕</button>
          </div>
        </div>
        <button type="button" class="add-row-btn" data-add-to="step-list" data-name="steps"
                data-maxlength="500">+ Add step</button>
      </div>

      <button type="submit" class="save-btn">Save recipe →</button>
    </form>
  </main>

  <script>
    function makeRow(name, maxlength) {
      const row = document.createElement('div');
      row.className = 'dyn-row';
      row.draggable = true;
      row.innerHTML = `<span class="drag-handle">⠿</span><input type="text" name="${name}" maxlength="${maxlength}" required><button type="button" class="remove-row">✕</button>`;
      return row;
    }

    document.querySelectorAll('.add-row-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const list = document.getElementById(btn.dataset.addTo);
        const row = makeRow(btn.dataset.name, btn.dataset.maxlength);
        list.appendChild(row);
        row.querySelector('input').focus();
      });
    });

    document.querySelectorAll('.dyn-list').forEach(list => {
      list.addEventListener('click', e => {
        if (e.target.classList.contains('remove-row')) {
          e.target.closest('.dyn-row').remove();
        }
      });

      let dragged = null;

      list.addEventListener('dragstart', e => {
        const row = e.target.closest('.dyn-row');
        if (!row) return;
        dragged = row;
        row.classList.add('dragging');
      });

      list.addEventListener('dragend', () => {
        dragged?.classList.remove('dragging');
        dragged = null;
      });

      list.addEventListener('dragover', e => {
        e.preventDefault();
        const row = e.target.closest('.dyn-row');
        if (!row || row === dragged) return;
        const rect = row.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        list.insertBefore(dragged, before ? row : row.nextSibling);
      });
    });
  </script>

</body>

</html>
