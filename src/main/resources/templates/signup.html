<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Sign up</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    .login-form {
      max-width: 320px;
      margin: 3rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-form input {
      padding: 0.5rem;
      border: 2px solid var(--chrome);
      font-family: inherit;
      font-size: 1rem;
    }

    .login-form button {
      padding: 0.6rem;
      background: var(--chrome);
      color: var(--bg);
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    .login-form button:hover {
      background: #2e4d3f;
    }

    .form-errors {
      color: var(--accent);
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin: 0;
    }

    .form-errors li {
      margin: 0.25rem 0;
    }
  </style>
</head>

<body>
  <div th:insert="~{fragments/header :: header}"></div>
  <header th:insert="~{fragments/nav :: nav}"></header>

  <main>
    <form class="login-form" th:action="@{/signup}" th:object="${signupForm}" method="post">
      <ul class="form-errors" th:if="${#fields.hasAnyErrors()}">
        <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
      </ul>

      <input type="text" th:field="*{username}" placeholder="Username" autocomplete="username" maxlength="50" required>
      <input type="password" th:field="*{password}" placeholder="Password" autocomplete="new-password" required>
      <input type="password" th:field="*{confirmPassword}" placeholder="Confirm password" autocomplete="new-password" required>
      <button type="submit">Sign up</button>
    </form>
  </main>
</body>

</html>
