<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Your household</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    .group-page {
      max-width: 560px;
      margin: 3rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .invite-row {
      display: flex;
      gap: 0.5rem;
    }

    .invite-row input {
      flex: 1;
      padding: 0.5rem;
      border: 2px solid var(--chrome);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .invite-row button, .regenerate-form button {
      padding: 0.5rem 1rem;
      background: var(--chrome);
      color: var(--bg);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .invite-row button:hover, .regenerate-form button:hover {
      background: #2e4d3f;
    }

    .regenerate-form button {
      background: none;
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    .regenerate-form button:hover {
      background: var(--accent);
      color: white;
    }

    .invite-note {
      margin: 0;
      color: var(--chrome);
      border-left: 3px solid var(--chrome);
      padding-left: 0.75rem;
    }

    .leave-form {
      margin-top: 1rem;
    }

    .leave-btn {
      padding: 0.5rem 1rem;
      background: none;
      color: var(--accent);
      border: 2px solid var(--accent);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .leave-btn:hover {
      background: var(--accent);
      color: white;
    }
  </style>
</head>

<body>
  <div th:insert="~{fragments/header :: header}"></div>
  <header th:insert="~{fragments/nav :: nav}"></header>

  <main>
    <div class="group-page">
      <h1>Your household</h1>
      <p>Share this link with anyone you want in your household. Anyone with the link can join.</p>
      <p class="invite-note">Whoever joins will see all of your household's recipes — and you'll see theirs.</p>

      <div class="invite-row">
        <input type="text" id="invite-url" th:value="${inviteUrl}" readonly>
        <button type="button" id="copy-invite">Copy</button>
      </div>

      <form class="regenerate-form" th:action="@{/group/invite/regenerate}" method="post">
        <button type="submit">Regenerate link (invalidates the old one)</button>
      </form>

      <form class="leave-form" th:action="@{/group/leave}" method="post">
        <button type="submit" class="leave-btn">Leave household</button>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('copy-invite').addEventListener('click', () => {
      const input = document.getElementById('invite-url');
      input.select();
      navigator.clipboard.writeText(input.value);
    });

    document.querySelector('.leave-form')?.addEventListener('submit', e => {
      if (!confirm("Leave this household? You'll stop seeing its recipes, and it'll stop seeing yours.")) {
        e.preventDefault();
      }
    });
  </script>
</body>

</html>
