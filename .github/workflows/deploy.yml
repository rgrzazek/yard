name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: gradle

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yard:latest

      # Reports to the repo's Security tab; doesn't block the deploy below
      # (add `if: failure()` gating or check the exit code to make it blocking).
      # Runs Trivy directly via its official image, pinned by digest, rather
      # than the aquasecurity/trivy-action wrapper — that wrapper (and the
      # trivy binary itself, v0.69.4) had a real supply-chain compromise in
      # March 2026: poisoned release tags used to steal CI secrets. It's since
      # been remediated, but pinning by digest here means it can't be
      # silently repointed the same way a tag could.
      # Scans the pushed image straight from ghcr.io — no docker.sock mount,
      # since the local daemon never has the image loaded (build step doesn't
      # `load: true`) and would grant the container needless host-daemon access.
      - name: Scan image for known CVEs
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --format sarif --output /repo/trivy-results.sarif \
            ghcr.io/${{ github.repository_owner }}/yard:latest

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/yard
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
